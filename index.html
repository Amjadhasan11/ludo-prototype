<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jellyfish Ludo Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: one app frame — a top bar, then one screen at a time; the board screen is board + side panel */
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f7fb; --line:#d6dde8; --fg:#1d2433; --muted:#5d6a80;
  --accent:#2b5fd9; --accent-fg:#ffffff; --danger:#c8353b; --ok:#1f8a4c; --warn:#b7791f;
  --red:#e2463f; --green:#2fa65a; --yellow:#f2b705; --blue:#2f6fd6;
  --red-soft:#fbe1df; --green-soft:#dcf2e3; --yellow-soft:#fdf1c8; --blue-soft:#dce7fa;
  --cell:#ffffff; --cell-line:#c9d1de; --shadow:0 1px 2px rgba(20,30,50,.08),0 6px 20px rgba(20,30,50,.08);
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a26; --surface:#1d2535; --surface-2:#232d40; --line:#33405a; --fg:#e8edf6; --muted:#a3afc4;
  --accent:#6f9bff; --accent-fg:#0f1420; --danger:#ff7378; --ok:#5fd18f; --warn:#f0b955;
  --red-soft:#4a2424; --green-soft:#1f3d2b; --yellow-soft:#463b14; --blue-soft:#1f2f4f;
  --cell:#f4f6fa; --cell-line:#aeb8c9; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a26; --surface:#1d2535; --surface-2:#232d40; --line:#33405a; --fg:#e8edf6; --muted:#a3afc4;
  --accent:#6f9bff; --accent-fg:#0f1420; --danger:#ff7378; --ok:#5fd18f; --warn:#f0b955;
  --red-soft:#4a2424; --green-soft:#1f3d2b; --yellow-soft:#463b14; --blue-soft:#1f2f4f;
  --cell:#f4f6fa; --cell-line:#aeb8c9; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px}
.brand .dots{display:grid;grid-template-columns:repeat(2,10px);gap:3px}
.brand .dots i{width:10px;height:10px;border-radius:3px;display:block}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface)}
.screen{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.screen-head h2{font-size:30px}
.sub{color:var(--muted);margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;font-weight:700;min-height:42px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* Menu */
.menu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
.menu h1{font-size:clamp(44px,8vw,76px);font-weight:800;letter-spacing:-.01em}
.menu h1 span:nth-child(1){color:var(--red)}.menu h1 span:nth-child(2){color:var(--green)}.menu h1 span:nth-child(3){color:var(--yellow)}.menu h1 span:nth-child(4){color:var(--blue)}
.menu-list{display:grid;gap:12px}
.menu-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:17px}
.menu-btn:hover{border-color:var(--accent)}
.menu-btn small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.menu-btn .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#fff;flex:none}
.mini-board{aspect-ratio:1;max-width:340px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;transform:rotate(-4deg)}
.mini-board i{border-radius:18px;display:block}
/* Forms */
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;width:100%}
textarea{font:inherit;color:inherit;resize:vertical;min-height:70px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface-2);gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 16px;font-weight:700}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent)}
.setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.player-card{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--surface-2)}
.player-card[hidden]{display:none}
.swatches{display:flex;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.swatch[aria-pressed=true]{border-color:var(--fg)}
.swatch:disabled{opacity:.25;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em}
.dice-info{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--muted)}
/* Board screen */
.game{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.board-wrap{min-width:0}
.board{width:100%;max-width:600px;aspect-ratio:1;margin:0 auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);
  background:var(--cell-line);border:2px solid #39445a;border-radius:10px;overflow:hidden;gap:1px;position:relative}
.cell{background:var(--cell);position:relative;display:grid;place-items:center;font-size:clamp(8px,1.6vw,13px);color:#39445a;font-weight:800}
.cell.home-red{background:var(--red)}.cell.home-green{background:var(--green)}.cell.home-yellow{background:var(--yellow)}.cell.home-blue{background:var(--blue)}
.cell.start-red{background:#f7b9b5}.cell.start-green{background:#b5e3c4}.cell.start-yellow{background:#fbe39a}.cell.start-blue{background:#b6cdf3}
.cell.q-easy{background:#9ad9ad}.cell.q-medium{background:#f8d76b}.cell.q-hard{background:#f19a95}
.cell.surprise{background:#c9b6f2}
.cell .sym{pointer-events:none;line-height:1}
.base{grid-row:span 6;grid-column:span 6;display:grid;place-items:center;padding:10%}
.base.red{background:var(--red);grid-area:1/1/7/7}.base.green{background:var(--green);grid-area:1/10/7/16}
.base.yellow{background:var(--yellow);grid-area:10/10/16/16}.base.blue{background:var(--blue);grid-area:10/1/16/7}
.base-inner{background:#fff;border-radius:12%;width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:10%;padding:14%;position:relative}
.slot{border-radius:50%;background:#eef1f6;display:grid;place-items:center;position:relative}
.base-name{position:absolute;left:0;right:0;bottom:-2px;transform:translateY(100%);text-align:center;color:#fff;font-weight:800;font-size:clamp(9px,1.5vw,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{grid-area:7/7/10/10;background:conic-gradient(from 45deg,var(--green) 0 25%,var(--yellow) 0 50%,var(--blue) 0 75%,var(--red) 0 100%);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:clamp(10px,1.8vw,15px);font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.piece{width:72%;height:72%;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45),inset 0 -3px 0 rgba(0,0,0,.18);position:relative;z-index:2;padding:0}
.piece.red{background:var(--red)}.piece.green{background:var(--green)}.piece.yellow{background:var(--yellow)}.piece.blue{background:var(--blue)}
.piece.can{animation:pulse 1s ease-in-out infinite;outline:3px solid #111;outline-offset:1px;cursor:pointer}
.cell .piece{position:absolute;width:70%;height:70%}
.cell .piece.n2{transform:translate(-18%,-18%)}.cell .piece.n2+.piece{transform:translate(18%,18%)}
@keyframes pulse{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.piece.can{animation:none}}
.panel{display:grid;gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface-2)}
.turn{display:flex;align-items:center;gap:12px}
.turn .chip{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.turn strong{font-family:var(--display);font-size:22px;line-height:1}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.timer{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.dice-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.die{width:58px;height:58px;border-radius:12px;background:#fff;border:2px solid #39445a;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:28px;color:#1d2433;position:relative}
.die.boost{border-color:#7a4fd6;color:#7a4fd6}
.die small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted)}
.die.rolling{animation:shake .4s}
@keyframes shake{25%{transform:rotate(12deg)}75%{transform:rotate(-12deg)}}
.steps{font-size:14px;color:var(--muted);margin-top:22px}
.steps b{color:var(--fg)}
.log{font-size:14px;min-height:64px;display:grid;gap:4px}
.log p{margin:0}
.log p:first-child{font-weight:700}
.log p+p{color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:18px;border-radius:4px;border:1px solid var(--cell-line);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#39445a;flex:none}
.proto-note{font-size:12px;color:var(--muted)}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;display:grid;gap:14px;border:1px solid var(--line)}
.modal h3{font-size:24px}
.level{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.level.easy{background:var(--green-soft);color:var(--ok)}
.level.medium{background:var(--yellow-soft);color:var(--warn)}
.level.hard{background:var(--red-soft);color:var(--danger)}
.answers{display:grid;gap:8px}
.answer{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);font-weight:600}
.answer b{font-family:var(--mono);color:var(--muted)}
.answer[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.answer.correct{border-color:var(--ok);background:var(--green-soft)}
.answer.wrong{border-color:var(--danger);background:var(--red-soft)}
.feedback{font-weight:700;border-radius:10px;padding:10px 12px}
.feedback.ok{background:var(--green-soft);color:var(--ok)}
.feedback.bad{background:var(--red-soft);color:var(--danger)}
.surprise-card{display:grid;justify-items:center;text-align:center;gap:8px;padding:10px}
.surprise-card .big{font-size:52px;line-height:1;font-family:var(--display);color:#7a4fd6}
.odds{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%}
.odds div{border-radius:8px;padding:6px 2px;font-size:11px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.odds div.hit{border-color:#7a4fd6;background:color-mix(in srgb,#7a4fd6 15%,var(--surface))}
/* Results */
.podium{display:grid;gap:10px;max-width:520px}
.rank{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.rank .pos{font-family:var(--display);font-size:28px;font-weight:800;width:44px}
.rank .chip{width:22px;height:22px;border-radius:50%}
.summary{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0}
.summary div{display:grid}
.summary b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dash{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* Admin */
.login{max-width:420px;margin:10px auto;display:grid;gap:14px}
.lock{width:52px;height:52px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;font-size:24px}
.hint{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.q-text{max-width:420px}
.opts-grid{display:grid;gap:8px}
.opt-row{display:flex;gap:8px;align-items:center}
.opt-row input[type=radio]{width:20px;height:20px;flex:none;accent-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;box-shadow:var(--shadow)}
@media (max-width:860px){.game{grid-template-columns:minmax(0,1fr)}.menu{grid-template-columns:minmax(0,1fr)}.mini-board{max-width:200px}}
@media (max-width:620px){.setup-grid{grid-template-columns:minmax(0,1fr)}.screen{padding:16px}.legend{grid-template-columns:1fr}}
</style>
</head>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dots"><i style="background:var(--red)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i></span>Ludo · Jellyfish</div>

</div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>

/* ---------- App state ---------- */
const S={setup:{count:4,diff:"medium",players:[
  {name:"Lina",color:"red"},{name:"Omar",color:"green"},{name:"Sara",color:"yellow"},{name:"Yousef",color:"blue"}]},
  game:null, admin:{logged:false,fails:0,lockUntil:0}, histFilter:"all", qFilter:"all", qSearch:""};

/* Scripted dice for the classroom demo, then random */
const SCRIPT=[[6,2],[3,2],[2,3],[5,1],[6,3],[4,2]];
const SCRIPT_SURPRISE=[3];

const $=s=>document.querySelector(s);
const view=$("#view");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toast-root").append(t);setTimeout(()=>t.remove(),2200)}
function modal(html){$("#modal-root").innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const f=$("#modal-root .modal button,#modal-root .modal input");f&&f.focus()}
function closeModal(){$("#modal-root").innerHTML=""}
function go(name){S.screen=name;render();window.scrollTo(0,0)}
function render(){
  if(S.game&&S.screen!=="board"){stopTimer()}
  ({menu:renderMenu,setup:renderSetup,board:renderBoard,results:renderResults,history:renderHistory,login:renderLogin,questions:renderQuestions})[S.screen||"menu"]();
}

/* ---------- Main menu ---------- */

  view.innerHTML=`<section class="screen"><div class="menu">
    <div>
      <h1><span>L</span><span>u</span><span>d</span><span>o</span></h1>
      <p class="sub" style="font-size:17px;max-width:42ch">The classic race to the centre, with Software Engineering questions on the way. 2–4 players on one computer.</p>
      <div class="mini-board" aria-hidden="true" style="margin-top:24px"><i style="background:var(--red)"></i><i style="background:var(--green)"></i><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i></div>
    </div>
    <nav class="menu-list" aria-label="Main menu">
      <button class="menu-btn" id="m-new"><span class="ic" style="background:var(--red)">▶</span><span>New Game<small>Choose players, colours and difficulty</small></span></button>
      <button class="menu-btn" id="m-hist"><span class="ic" style="background:var(--green)">≡</span><span>Game History<small>Results of finished games</small></span></button>
      <button class="menu-btn" id="m-q"><span class="ic" style="background:var(--blue)">🔒</span><span>Question Management<small>Administrators only</small></span></button>
      <button class="menu-btn" id="m-exit"><span class="ic" style="background:#6b7486">✕</span><span>Exit<small>Close the game</small></span></button>
    </nav></div></section>`;
  $("#m-new").onclick=()=>go("setup");
  $("#m-hist").onclick=()=>go("history");
  $("#m-q").onclick=()=>go(S.admin.logged?"questions":"login");
  $("#m-exit").onclick=()=>modal(`<h3>Exit the game?</h3><p class="sub">In the real application this closes the window. The prototype stays open.</p><div class="row"><button class="btn primary" id="x-ok">OK</button></div>`)||($("#x-ok").onclick=closeModal);
}

/* ---------- Setup ---------- */
function renderSetup(){
  const st=S.setup;
  const used=st.players.slice(0,st.count).map(p=>p.color);
  view.innerHTML=`<section class="screen">
    <div class="screen-head"><div><h2>New game</h2><p class="sub">Set up the players, then start.</p></div><button class="btn ghost" id="s-back">← Main menu</button></div>
    <div class="setup-grid">
      <div class="field"><span class="lbl">Number of players</span><div class="seg" role="group" aria-label="Number of players">${[2,3,4].map(n=>`<button data-n="${n}" aria-pressed="${st.count===n}">${n} players</button>`).join("")}</div></div>
      <div class="field"><span class="lbl">Difficulty</span><div class="seg" role="group" aria-label="Difficulty">${["easy","medium","hard"].map(d=>`<button data-d="${d}" aria-pressed="${st.diff===d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("")}</div></div>
    </div>
    <p class="dice-info" style="margin:18px 0">${diceText(st.diff)}</p>
    <div class="setup-grid">${st.players.map((p,i)=>`
      <div class="player-card" ${i>=st.count?"hidden":""}>
        <div class="field"><label for="pn${i}">Player ${i+1} name</label><input type="text" id="pn${i}" data-i="${i}" value="${esc(p.name)}" maxlength="16" placeholder="Name or nickname"></div>
        <div class="field"><span class="lbl">Colour</span><div class="swatches">${Object.keys(COLORS).map(c=>`<button class="swatch" style="background:var(--${c})" data-i="${i}" data-c="${c}" aria-label="${COLORS[c].label}" aria-pressed="${p.color===c}" ${used.includes(c)&&p.color!==c?"disabled":""}></button>`).join("")}</div></div>
      </div>`).join("")}</div>
    <p class="err" id="s-err"></p>
    <div class="row"><button class="btn primary" id="s-start">Start game</button><button class="btn" id="s-back2">Back</button></div>
  </section>`;
  view.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{st.count=+b.dataset.n;renderSetup()});
  view.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{st.diff=b.dataset.d;renderSetup()});
  view.querySelectorAll(".swatch").forEach(b=>b.onclick=()=>{st.players[+b.dataset.i].color=b.dataset.c;renderSetup()});
  view.querySelectorAll("input[data-i]").forEach(inp=>inp.oninput=()=>{st.players[+inp.dataset.i].name=inp.value});
  $("#s-back").onclick=$("#s-back2").onclick=()=>go("menu");
  $("#s-start").onclick=()=>{
    const ps=st.players.slice(0,st.count);
    const bad=ps.findIndex(p=>!p.name.trim());
    if(bad>=0){$("#s-err").textContent=`Player ${bad+1} needs a name before the game can start.`;$("#pn"+bad).focus();return}
    const names=ps.map(p=>p.name.trim().toLowerCase());
    if(new Set(names).size!==names.length){$("#s-err").textContent="Two players have the same name. Give each player a different name.";return}
    startGame();
  };
}
function diceText(d){return d==="easy"?"<b>Easy board:</b> regular die only. No question or surprise squares.":d==="medium"?"<b>Medium board:</b> regular die + Boost die (1–3). Steps = regular × (Boost − 1). 6 question squares, 2 surprise squares.":"<b>Hard board:</b> regular die + UltraBoost die (1–6). Steps = regular × (UltraBoost − 1). 9 question squares, 3 surprise squares."}

/* ---------- Game engine (simplified for the prototype) ---------- */
let timerId=null;
function startGame(){
  const st=S.setup;
  S.game={diff:st.diff,players:st.players.slice(0,st.count).map(p=>({name:p.name.trim(),color:p.color,pieces:[-1,-1,-1,-1],skip:false,done:false})),
    turn:0,dice:null,steps:0,phase:"roll",sixes:0,startedAt:Date.now(),script:SCRIPT.slice(),sScript:SCRIPT_SURPRISE.slice(),log:["Game started. "+st.players[0].name+" rolls first."],finishOrder:[]};
  go("board");
}
function stopTimer(){clearInterval(timerId);timerId=null}
const fmt=ms=>{const s=Math.floor(ms/1000);return [s/3600,(s%3600)/60,s%60].map(v=>String(Math.floor(v)).padStart(2,"0")).join(":")};
function abs(color,rel){ if(rel<0||rel>56) return null; if(rel<=50) return {type:"track",idx:(COLORS[color].start+rel)%52}; return {type:"home",cell:COLORS[color].home[rel-51]} }
function cellOf(color,rel){const a=abs(color,rel);if(!a)return null;return a.type==="track"?PATH[a.idx]:a.cell}
function isSafe(idx){return STARS.includes(idx)||[0,13,26,39].includes(idx)||SURPRISES.includes(idx)}
function cur(){return S.game.players[S.game.turn]}
function legal(p){
  const g=S.game;if(!g.dice)return[];
  return p.pieces.map((r,i)=>{ if(r===57)return null; if(r===-1)return g.dice[0]===6?i:null; if(g.steps<=0)return null; return r+g.steps<=57?i:null}).filter(v=>v!==null);
}
function roll(){
  const g=S.game;if(g.phase!=="roll")return;
  let d;
  if(g.script.length) d=g.script.shift(); else d=[1+Math.floor(Math.random()*6), g.diff==="medium"?1+Math.floor(Math.random()*3):g.diff==="hard"?1+Math.floor(Math.random()*6):null];
  if(g.diff==="easy") d=[d[0],null];
  g.dice=d; g.steps=g.diff==="easy"?d[0]:d[0]*(d[1]-1);
  const p=cur(); const opts=legal(p);
  const diceStr=g.diff==="easy"?`${d[0]}`:`${d[0]} and ${g.diff==="medium"?"Boost":"UltraBoost"} ${d[1]} → ${g.steps} steps`;
  if(!opts.length){ g.log=[`${p.name} rolled ${diceStr}.`, p.pieces.every(r=>r===-1)?"No piece is on the board and a 6 is needed to leave the castle. Turn passes.":"No legal move. Turn passes."]; g.phase="wait"; renderBoard(true); setTimeout(()=>nextTurn(false),1300); return }
  g.phase="move"; g.log=[`${p.name} rolled ${diceStr}.`, d[0]===6&&p.pieces.some(r=>r===-1)?"A 6! Bring a new piece out, or move a piece on the board. Click a glowing piece.":"Click a glowing piece to move it."];
  renderBoard(true);
}
function move(i){
  const g=S.game,p=cur();if(g.phase!=="move"||!legal(p).includes(i))return;
  let r=p.pieces[i];
  if(r===-1){p.pieces[i]=0;g.log=[`${p.name} brings a piece out to the start square.`];}
  else {p.pieces[i]=r+g.steps;g.log=[`${p.name} moves a piece ${g.steps} steps.`];}
  capture(p,i);
  const landed=abs(p.color,p.pieces[i]);
  if(p.pieces[i]===57){g.log.push("The piece reached the finish!");checkFinish(p)}
  g.phase="wait";renderBoard();
  if(landed&&landed.type==="track"&&r!==-1&&g.diff!=="easy"){
    if(QUESTIONS_SQ[landed.idx]) return setTimeout(()=>askQuestion(i,QUESTIONS_SQ[landed.idx]),350);
    if(SURPRISES.includes(landed.idx)) return setTimeout(()=>surprise(i),350);
  }
  afterMove();
}
function capture(p,i){
  const a=abs(p.color,p.pieces[i]);if(!a||a.type!=="track"||isSafe(a.idx))return;
  S.game.players.forEach(o=>{if(o===p)return;const hits=o.pieces.map((r,j)=>{const b=abs(o.color,r);return b&&b.type==="track"&&b.idx===a.idx?j:null}).filter(v=>v!==null);
    if(hits.length===1){o.pieces[hits[0]]=-1;S.game.log.push(`Captured! ${o.name}'s piece goes back to the castle.`)}});
}
function checkFinish(p){ if(p.pieces.every(r=>r===57)&&!p.done){p.done=true;S.game.finishOrder.push(p)} }
function afterMove(){
  const g=S.game;
  const left=g.players.filter(p=>!p.done);
  if(left.length<=1) return endGame();
  const again=g.dice&&g.dice[0]===6&&!cur().done;
  setTimeout(()=>nextTurn(again),again?600:900);
}
function nextTurn(again){
  const g=S.game;if(!g||S.screen!=="board")return;
  if(again){g.sixes++; if(g.sixes>=3){g.log=[`${cur().name} rolled three 6s in a row. The third roll is cancelled.`];again=false}else{g.log=[`${cur().name} rolled a 6 and rolls again.`]}}
  if(!again){g.sixes=0;let n=g.turn;for(let k=0;k<g.players.length;k++){n=(n+1)%g.players.length;const p=g.players[n];if(p.done)continue;if(p.skip){p.skip=false;g.log=[`${p.name} loses this turn (surprise event).`];continue}break}g.turn=n;g.log=[...(g.log.length&&g.log[0].includes("loses")?g.log:[]),`${cur().name}'s turn. Roll the dice.`]}
  g.dice=null;g.steps=0;g.phase="roll";renderBoard();
}
function askQuestion(pi,level){
  const g=S.game,p=cur();const pool=questionBank.filter(q=>q.level===level);const q=pool[Math.floor(Math.random()*pool.length)]||questionBank[0];
  const n={easy:1,medium:2,hard:3}[level];let pick=null;
  modal(`<div class="row" style="justify-content:space-between"><span class="level ${level}">● ${level} question</span><span class="sub">${esc(p.name)} · ${COLORS[p.color].label}</span></div>
    <h3 id="q-title">${esc(q.text)}</h3>
    <div class="answers" role="radiogroup" aria-labelledby="q-title">${q.opts.map((o,i)=>`<button class="answer" data-a="${i}" aria-pressed="false"><b>${"ABCD"[i]}</b>${esc(o)}</button>`).join("")}</div>
    <p class="sub" id="q-rule">Correct: move ${n} step${n>1?"s":""} forward. Wrong: move ${n} step${n>1?"s":""} back.</p>
    <div id="q-fb"></div>
    <div class="row"><button class="btn primary" id="q-submit" disabled>Submit answer</button></div>`);
  document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{if(pick==="done")return;pick=+b.dataset.a;document.querySelectorAll(".answer").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#q-submit").disabled=false});
  $("#q-submit").onclick=function(){
    if(pick==="done"){closeModal();renderBoard();afterMove();return}
    const ok=pick===q.correct;
    document.querySelectorAll(".answer").forEach((x,i)=>{if(i===q.correct)x.classList.add("correct");else if(i===pick)x.classList.add("wrong")});
    const r=p.pieces[pi];p.pieces[pi]=ok?Math.min(57,r+n):Math.max(0,r-n);
    if(ok&&r+n>57)p.pieces[pi]=r;
    $("#q-fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}">${ok?`Correct! Your piece moves ${n} step${n>1?"s":""} forward.`:`Not quite. The answer is ${"ABCD"[q.correct]}. Your piece moves ${n} step${n>1?"s":""} back.`}</div>`;
    g.log=[`${p.name} answered a ${level} question ${ok?"correctly":"incorrectly"}.`,`Piece moved ${n} step${n>1?"s":""} ${ok?"forward":"back"}.`];
    capture(p,pi);checkFinish(p);pick="done";this.textContent="Continue";
  };
}
function surprise(pi){
  const g=S.game,p=cur();
  let e;if(g.sScript.length)e=g.sScript.shift();else{let x=Math.random()*100,a=0;e=SURPRISE_EVENTS.findIndex(v=>(a+=v.p)>x)}
  const ev=SURPRISE_EVENTS[e];
  modal(`<div class="surprise-card"><span class="level" style="background:color-mix(in srgb,#7a4fd6 15%,var(--surface));color:#7a4fd6">★ Surprise square</span>
    <div class="big" aria-hidden="true">${ev.icon}</div><h3>${ev.title}</h3><p class="sub">${ev.text}</p>
    <div class="odds" aria-label="Event chances">${SURPRISE_EVENTS.map((v,i)=>`<div class="${i===e?"hit":""}">${v.icon}<br>${v.p}%</div>`).join("")}</div></div>
    <div class="row" style="justify-content:center"><button class="btn primary" id="sv-ok">OK</button></div>`);
  $("#sv-ok").onclick=()=>{
    const r=p.pieces[pi];
    if(e===0)p.pieces[pi]=57; else if(e===2)p.pieces[pi]=-1; else if(e===3)p.pieces[pi]=Math.max(0,r-3); else if(e===4)p.skip=true;
    g.log=[`Surprise for ${p.name}: ${ev.title.toLowerCase()}.`];
    checkFinish(p);closeModal();
    if(e===5){g.script.unshift([1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]);g.log.push("Bonus roll now.");g.dice=null;g.phase="roll";renderBoard();return}
    renderBoard();afterMove();
  };
}
function endGame(){
  const g=S.game;stopTimer();
  const order=[...g.finishOrder,...g.players.filter(p=>!p.done)];
  g.result={order,dur:fmt(Date.now()-g.startedAt),diff:g.diff};
  const d=new Date();const pad=v=>String(v).padStart(2,"0");
  history.unshift({id:history.length+1,diff:g.diff,ts:`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()};${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`,r:[0,1,2,3].map(i=>order[i]?order[i].name:""),dur:g.result.dur});
  go("results");
}
function demoFinish(){ // prototype shortcut: ranks players by progress
  const g=S.game;const prog=p=>p.pieces.reduce((a,r)=>a+(r<0?0:r),0);
  g.finishOrder=[...g.players].sort((a,b)=>prog(b)-prog(a)).slice(0,g.players.length-1);g.finishOrder.forEach(p=>p.done=true);endGame();
}

/* ---------- Board screen ---------- */
function renderBoard(rolled){
  const g=S.game;if(!g){go("setup");return}
  const p=cur();const opts=g.phase==="move"?legal(p):[];
  const cells=[];
  const onTrack={};
  g.players.forEach(pl=>pl.pieces.forEach((r,i)=>{const c=cellOf(pl.color,r);if(c){const k=c.join(",");(onTrack[k]=onTrack[k]||[]).push({pl,i})}}));
  const homeCells={};Object.entries(COLORS).forEach(([c,m])=>m.home.forEach(h=>homeCells[h.join(",")]=c));
  const trackIdx={};PATH.forEach((c,i)=>trackIdx[c.join(",")]=i);
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    if((r<6||r>8)&&(c<6||c>8))continue; if(r>=6&&r<=8&&c>=6&&c<=8)continue;
    const k=r+","+c;let cls="cell",sym="",lab="";
    if(homeCells[k]){cls+=" home-"+homeCells[k];lab="home path"}
    else if(trackIdx[k]!==undefined){const i=trackIdx[k];
      const st=Object.entries(COLORS).find(([,m])=>m.start===i);
      if(st){cls+=" start-"+st[0];sym="#";lab="start square"}
      else if(ARROWS[i]){sym=`<span style="color:var(--${ARROWS[i]})">➜</span>`;lab="arrow"}
      else if(STARS.includes(i)){sym="★";lab="protection square"}
      if(g.diff!=="easy"&&QUESTIONS_SQ[i]){cls+=" q-"+QUESTIONS_SQ[i];sym="?";lab=QUESTIONS_SQ[i]+" question"}
      if(g.diff!=="easy"&&SURPRISES.includes(i)){cls+=" surprise";sym="🎁";lab="surprise"}
    }
    const ps=(onTrack[k]||[]).map((o,n,a)=>pieceBtn(o.pl,o.i,a.length>1&&n===0?"n2":"",o.pl===p&&opts.includes(o.i))).join("");
    cells.push(`<div class="${cls}" style="grid-area:${r+1}/${c+1}" ${lab?`title="${lab}"`:""}><span class="sym">${sym}</span>${ps}</div>`);
  }
  const bases=Object.keys(COLORS).map(c=>{const pl=g.players.find(x=>x.color===c);
    const slots=[0,1,2,3].map(i=>`<div class="slot">${pl&&pl.pieces[i]===-1?pieceBtn(pl,i,"",pl===p&&opts.includes(i)):""}</div>`).join("");
    return `<div class="base ${c}"><div class="base-inner">${slots}</div></div>`}).join("");
  const fin=g.players.map(pl=>`<span title="${esc(pl.name)}" style="display:inline-flex;align-items:center;gap:4px"><i class="chip" style="width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--${pl.color})"></i>${pl.pieces.filter(r=>r===57).length}/4</span>`).join(" ");
  const boostLabel=g.diff==="medium"?"Boost":"UltraBoost";
  view.innerHTML=`<section class="screen"><div class="game">
    <div class="board-wrap"><div class="board" aria-label="Ludo board">${bases}${cells.join("")}<div class="center">HOME</div></div>
      <p class="proto-note" style="text-align:center;margin:10px 0 0">Prototype: the ${g.diff} board is drawn on the base 52-square layout. Special-square positions are sample data.</p></div>
    <aside class="panel">
      <div class="card"><div class="stat"><span class="lbl">Time</span><span class="timer" id="timer">${fmt(Date.now()-g.startedAt)}</span></div>
        <div class="stat"><span class="lbl">Difficulty</span><b style="text-transform:capitalize">${g.diff}</b></div></div>
      <div class="card"><span class="lbl">Now playing</span><div class="turn" style="margin-top:6px"><span class="chip" style="background:var(--${p.color})"></span><strong>${esc(p.name)}</strong></div></div>
      <div class="card">
        <div class="dice-row"><div class="die ${rolled?"rolling":""}">${g.dice?g.dice[0]:"–"}<small>Regular</small></div>
        ${g.diff!=="easy"?`<div class="die boost ${rolled?"rolling":""}">${g.dice&&g.dice[1]!=null?g.dice[1]:"–"}<small>${boostLabel}</small></div>`:""}
        <button class="btn primary" id="b-roll" ${g.phase!=="roll"?"disabled":""} style="flex:1">🎲 Roll</button></div>
        <p class="steps">${g.dice?`Steps this turn: <b>${g.steps}</b>${g.diff!=="easy"?` (${g.dice[0]} × (${g.dice[1]} − 1))`:""}`:"Roll to see your steps."}</p>
      </div>
      <div class="card log" aria-live="polite">${g.log.map(l=>`<p>${esc(l)}</p>`).join("")}</div>
      <div class="card"><span class="lbl">Pieces finished</span><div class="row" style="margin-top:6px;font-size:14px">${fin}</div></div>
      <div class="card"><span class="lbl">Legend</span><div class="legend" style="margin-top:8px">
        <span><i style="background:#f7b9b5">#</i>Start square</span><span><i>★</i>Protection</span>
        <span><i>➜</i>Arrow to home path</span><span><i style="background:#c9b6f2">🎁</i>Surprise</span>
        <span><i style="background:#9ad9ad">?</i>Easy question</span><span><i style="background:#f8d76b">?</i>Medium question</span>
        <span><i style="background:#f19a95">?</i>Hard question</span><span><i style="background:var(--red)"></i>Home path</span></div></div>
      <div class="row"><button class="btn danger" id="b-exit">Exit game</button><button class="btn ghost" id="b-end" title="Prototype shortcut">⏭ Skip to end (demo)</button></div>
    </aside></div></section>`;
  $("#b-roll").onclick=roll;
  view.querySelectorAll(".piece.can").forEach(b=>b.onclick=()=>move(+b.dataset.i));
  $("#b-exit").onclick=()=>{modal(`<h3>Leave this game?</h3><p class="sub">The game is not finished, so it will not be saved to Game History.</p><div class="row"><button class="btn danger" id="e-yes">Leave game</button><button class="btn" id="e-no">Keep playing</button></div>`);
    $("#e-yes").onclick=()=>{closeModal();stopTimer();S.game=null;go("menu")};$("#e-no").onclick=closeModal};
  $("#b-end").onclick=demoFinish;
  if(!timerId)timerId=setInterval(()=>{const t=$("#timer");if(t&&S.game)t.textContent=fmt(Date.now()-S.game.startedAt)},1000);
}
function pieceBtn(pl,i,extra,can){return `<button class="piece ${pl.color} ${extra} ${can?"can":""}" data-i="${i}" ${can?"":"tabindex='-1'"} aria-label="${esc(pl.name)} piece ${i+1}${can?" (can move)":""}"></button>`}

/* ---------- Results ---------- */
function renderResults(){
  const g=S.game;if(!g||!g.result){go("menu");return}
  const res=g.result;
  view.innerHTML=`<section class="screen">
    <div class="screen-head"><div><h2>Game over</h2><p class="sub">The result was saved to Game History.</p></div></div>
    <div class="podium">${res.order.map((p,i)=>`<div class="rank"><span class="pos">${i+1}${["st","nd","rd","th"][i]}</span><span class="chip" style="background:var(--${p.color})"></span><b style="font-size:17px">${esc(p.name)}</b>${i===res.order.length-1?'<span class="sub" style="margin-left:auto">last place</span>':""}</div>`).join("")}</div>
    <div class="summary"><div><span class="lbl">Duration</span><b>${res.dur}</b></div><div><span class="lbl">Difficulty</span><b style="text-transform:capitalize;font-family:var(--body)">${res.diff}</b></div><div><span class="lbl">Players</span><b>${res.order.length}</b></div></div>
    <div class="row"><button class="btn primary" id="r-new">New game</button><button class="btn" id="r-hist">View history</button><button class="btn" id="r-menu">Main menu</button></div>
  </section>`;
  $("#r-new").onclick=()=>{S.game=null;go("setup")};$("#r-hist").onclick=()=>go("history");$("#r-menu").onclick=()=>{S.game=null;go("menu")};
}

/* ---------- History ---------- */
function renderHistory(){
  const rows=history.filter(h=>S.histFilter==="all"||h.diff===S.histFilter);
  view.innerHTML=`<section class="screen">
    <div class="screen-head"><div><h2>Game history</h2><p class="sub">Finished games, newest first. Records cannot be edited.</p></div>
      <div class="row"><label class="lbl" for="h-f">Difficulty</label><select id="h-f" style="width:auto">${["all","easy","medium","hard"].map(d=>`<option value="${d}" ${S.histFilter===d?"selected":""}>${d==="all"?"All":d[0].toUpperCase()+d.slice(1)}</option>`).join("")}</select></div></div>
    <div class="table-wrap"><table><thead><tr><th>Game ID</th><th>Difficulty</th><th>Date &amp; time</th><th>1st place</th><th>2nd place</th><th>3rd place</th><th>4th place</th><th>Duration</th></tr></thead>
    <tbody>${rows.length?rows.map(h=>`<tr><td class="num">${h.id}</td><td><span class="level ${h.diff}">${h.diff}</span></td><td class="num">${h.ts}</td>${h.r.map(n=>`<td>${n?esc(n):'<span class="dash">—</span>'}</td>`).join("")}<td class="num">${h.dur}</td></tr>`).join(""):`<tr><td colspan="8" class="empty">No ${S.histFilter} games yet. Finish a game to see it here.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="h-back">← Main menu</button></div></section>`;
  $("#h-f").onchange=e=>{S.histFilter=e.target.value;renderHistory()};$("#h-back").onclick=()=>go("menu");
}

/* ---------- Admin login ---------- */
function renderLogin(){
  const a=S.admin;const locked=Date.now()<a.lockUntil;
  view.innerHTML=`<section class="screen"><form class="login" id="l-form" novalidate>
    <div class="lock" aria-hidden="true">🔒</div>
    <div><h2 style="font-size:28px">Administrator login</h2><p class="sub">Question Management shows correct answers, so it is locked for players.</p></div>
    <div class="field"><label for="l-pw">Password</label><div class="row" style="flex-wrap:nowrap"><input type="password" id="l-pw" autocomplete="current-password" ${locked?"disabled":""}><button type="button" class="btn" id="l-show" aria-label="Show password">Show</button></div></div>
    <p class="err" id="l-err">${locked?lockMsg():a.fails?`Wrong password. ${3-a.fails} attempt${3-a.fails===1?"":"s"} left before a 30-second lock.`:""}</p>
    <div class="row"><button class="btn primary" type="submit" ${locked?"disabled":""}>Log in</button><button class="btn" type="button" id="l-back">Cancel</button></div>
    <p class="hint">Prototype password: <b style="font-family:var(--mono)">${ADMIN_PASSWORD}</b></p>
  </form></section>`;
  $("#l-back").onclick=()=>go("menu");
  $("#l-show").onclick=()=>{const i=$("#l-pw");i.type=i.type==="password"?"text":"password";$("#l-show").textContent=i.type==="password"?"Show":"Hide"};
  $("#l-form").onsubmit=e=>{e.preventDefault();if(Date.now()<a.lockUntil)return;
    const v=$("#l-pw").value;
    if(!v){$("#l-err").textContent="Enter the administrator password.";return}
    if(v===ADMIN_PASSWORD){a.logged=true;a.fails=0;toast("Logged in as administrator");go("questions");return}
    a.fails++;if(a.fails>=3){a.lockUntil=Date.now()+30000;a.fails=0;const t=setInterval(()=>{if(S.screen!=="login"){clearInterval(t);return}const el=$("#l-err");if(Date.now()>=a.lockUntil){clearInterval(t);renderLogin()}else if(el)el.textContent=lockMsg()},500)}
    renderLogin();};
  const pw=$("#l-pw");pw&&!locked&&pw.focus();
}
function lockMsg(){return `Too many wrong attempts. Try again in ${Math.ceil((S.admin.lockUntil-Date.now())/1000)} s.`}

/* ---------- Question management ---------- */
function renderQuestions(){
  if(!S.admin.logged){go("login");return}
  const cnt=l=>questionBank.filter(q=>q.level===l).length;
  const s=S.qSearch.toLowerCase();
  const rows=questionBank.filter(q=>(S.qFilter==="all"||q.level===S.qFilter)&&(!s||q.text.toLowerCase().includes(s)));
  view.innerHTML=`<section class="screen">
    <div class="screen-head"><div><h2>Question management</h2><p class="sub">Add, edit and delete the questions used on question squares.</p></div>
      <div class="row"><button class="btn primary" id="q-add">+ Add question</button><button class="btn" id="q-out">Log out</button></div></div>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="counts"><span class="level easy">Easy ${cnt("easy")}</span><span class="level medium">Medium ${cnt("medium")}</span><span class="level hard">Hard ${cnt("hard")}</span><span class="sub" style="font-size:13px">Sample of the 30+ question bank</span></div>
      <div class="row"><input type="text" id="q-s" placeholder="Search questions" value="${esc(S.qSearch)}" style="width:200px" aria-label="Search questions">
      <select id="q-f" style="width:auto" aria-label="Filter by level">${["all","easy","medium","hard"].map(d=>`<option value="${d}" ${S.qFilter===d?"selected":""}>${d==="all"?"All levels":d[0].toUpperCase()+d.slice(1)}</option>`).join("")}</select></div></div>
    <div class="table-wrap"><table><thead><tr><th>ID</th><th>Question</th><th>Level</th><th>Correct answer</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(q=>`<tr><td class="num">${q.id}</td><td class="q-text">${esc(q.text)}</td><td><span class="level ${q.level}">${q.level}</span></td><td>${"ABCD"[q.correct]}. ${esc(q.opts[q.correct])}</td>
      <td style="white-space:nowrap"><button class="btn ghost" data-edit="${q.id}">Edit</button><button class="btn ghost" data-del="${q.id}" style="color:var(--danger)">Delete</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">No questions match this search.</td></tr>`}</tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn" id="q-back">← Main menu</button></div></section>`;
  $("#q-add").onclick=()=>qForm(null);
  $("#q-out").onclick=()=>{S.admin.logged=false;toast("Logged out");go("menu")};
  $("#q-back").onclick=()=>{S.admin.logged=false;go("menu")};
  $("#q-f").onchange=e=>{S.qFilter=e.target.value;renderQuestions()};
  $("#q-s").oninput=e=>{S.qSearch=e.target.value;const pos=e.target.selectionStart;renderQuestions();const n=$("#q-s");n.focus();n.setSelectionRange(pos,pos)};
  view.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>qForm(questionBank.find(q=>q.id===b.dataset.edit)));
  view.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>qDelete(questionBank.find(q=>q.id===b.dataset.del)));
}
function qForm(q){
  const isNew=!q;q=q||{id:"Q-"+String(nextQ).padStart(3,"0"),level:"easy",text:"",opts:["","","",""],correct:0};
  modal(`<h3>${isNew?"Add question":"Edit question "+q.id}</h3>
    <div class="field"><label for="f-text">Question</label><textarea id="f-text" maxlength="200">${esc(q.text)}</textarea></div>
    <div class="field"><span class="lbl">Answers (select the correct one)</span><div class="opts-grid">${q.opts.map((o,i)=>`<div class="opt-row"><input type="radio" name="f-c" id="f-c${i}" value="${i}" ${q.correct===i?"checked":""} aria-label="Answer ${"ABCD"[i]} is correct"><input type="text" id="f-o${i}" value="${esc(o)}" placeholder="Answer ${"ABCD"[i]}"></div>`).join("")}</div></div>
    <div class="field"><label for="f-level">Level</label><select id="f-level">${["easy","medium","hard"].map(l=>`<option ${q.level===l?"selected":""} value="${l}">${l[0].toUpperCase()+l.slice(1)}</option>`).join("")}</select></div>
    <p class="err" id="f-err"></p>
    <div class="row"><button class="btn primary" id="f-save">${isNew?"Add question":"Save changes"}</button><button class="btn" id="f-cancel">Cancel</button></div>`);
  $("#f-cancel").onclick=closeModal;
  $("#f-save").onclick=()=>{
    const text=$("#f-text").value.trim();const opts=[0,1,2,3].map(i=>$("#f-o"+i).value.trim());const correct=+document.querySelector("input[name=f-c]:checked").value;const level=$("#f-level").value;
    const err=$("#f-err");
    if(!text)return err.textContent="Write the question text.";
    if(opts.some(o=>!o))return err.textContent="Fill in all four answers.";
    if(new Set(opts.map(o=>o.toLowerCase())).size<4)return err.textContent="Each answer must be different.";
    if(questionBank.some(x=>x.id!==q.id&&x.text.toLowerCase()===text.toLowerCase()))return err.textContent="A question with this text already exists.";
    if(isNew){questionBank.push({id:q.id,level,text,opts,correct});nextQ++;toast("Question "+q.id+" added")}
    else{Object.assign(q,{level,text,opts,correct});toast("Question "+q.id+" saved")}
    closeModal();renderQuestions();
  };
}
function qDelete(q){
  const left=questionBank.filter(x=>x.level===q.level).length-1;
  if(left<3){modal(`<h3>Can't delete ${q.id}</h3><p class="sub">Each level needs a minimum number of questions so games can always ask one. Add another ${q.level} question first, then delete this one.</p><div class="row"><button class="btn primary" id="d-ok">OK</button></div>`);$("#d-ok").onclick=closeModal;return}
  modal(`<h3>Delete question ${q.id}?</h3><p>${esc(q.text)}</p><p class="sub">It will no longer appear in games. This can't be undone.</p><div class="row"><button class="btn danger" id="d-yes">Delete</button><button class="btn" id="d-no">Cancel</button></div>`);
  $("#d-yes").onclick=()=>{questionBank=questionBank.filter(x=>x!==q);closeModal();toast("Question "+q.id+" deleted");renderQuestions()};$("#d-no").onclick=closeModal;
}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal-root").innerHTML&&!$("#q-submit")&&!$("#sv-ok"))closeModal()});
go("menu");
</script>

</body>
</html>
